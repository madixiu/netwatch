
# NetWatch nginx site (single file)
#
# Install on the server:
#   sudo cp netwatch.conf /etc/nginx/sites-available/netwatch
#   sudo ln -s /etc/nginx/sites-available/netwatch /etc/nginx/sites-enabled/netwatch
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Change these two things before installing:
#   1. netwatch.example.internal  -> your real server name (appears twice)
#   2. the certificate paths       -> where your internal CA files really are

# Send all plain HTTP traffic to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name netwatch.example.internal;

    return 301 https://$host$request_uri;
}

# HTTPS front end. Forwards everything to the NetWatch API on loopback.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name netwatch.pak;

    # TLS certificate and key from your internal CA.
    ssl_certificate     /etc/ssl/netwatch/netwatch.crt;
    ssl_certificate_key /etc/ssl/netwatch/netwatch.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:NetWatchSSL:10m;

    server_tokens off;
    client_max_body_size 64k;

    # Security headers.
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}